behaviors:

  # ── 6장: 집어서 옮기기 (관측 65 / 연속 행동 18) ──────────────────────
  # 걷기(5장)와 같은 몸 · 같은 신경망 크기. 처음부터 학습한다 (관측 수가 달라 5장 모델을 이어 쓸 수 없다).
  HumanoidCarry:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 512
      num_layers: 3
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    max_steps: 30000000        # 걷기만 1000만이 들었다. 잡기 · 들기 · 옮기기까지 더해진다
    time_horizon: 1000
    summary_freq: 50000

# 커리큘럼은 yaml 이 아니라 CarryAgent 안에 있다: 에이전트마다 최근 20판 성공률이 70% 를 넘으면 다음 난이도로.
# (yaml 커리큘럼은 보상 기준으로만 넘길 수 있는데, 성공 0 인데도 보상이 기준을 넘어 단계가 올라가 버렸다 — 실측)
