behaviors:

  # ── 3장: 서기 (관측 36 / 연속 행동 12) ───────────────────────────────
  HumanoidStand:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048          # 몸이 매번 다르게 넘어져 편차가 크다. 많이 모아 평균 낸다
      buffer_size: 20480        # batch_size의 10배
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true           # 속도·각도처럼 범위가 다른 관측을 자동으로 맞춘다
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99             # 약 100스텝(2초) 앞까지 본다. 넘어지면 그만큼을 잃는다
        strength: 1.0
    max_steps: 2000000
    time_horizon: 1000          # 한 판(MaxStep 1000)을 통째로 본다
    summary_freq: 20000
